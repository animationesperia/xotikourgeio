<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Ξωτικουργείο</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><div class="brand">Περιστέρι Πολλών Αστέρων</div><h1 class="heading">Ξωτικουργείο</h1><div class="sub2">Face Painting · Admin</div><section class="panel"><div class="login" id="login"><h2>Σύνδεση Admin</h2><input type="password" id="password" placeholder="Κωδικός Admin" autocomplete="current-password"><button class="btn full" id="loginBtn">Σύνδεση</button></div><div id="work" class="hidden"><div class="big"><small>ΤΩΡΑ ΕΞΥΠΗΡΕΤΕΙΤΑΙ</small><strong id="current">—</strong></div><div class="controls"><button class="btn" id="nextBtn">➡️ Επόμενος</button><button class="btn alt" id="finishBtn">✓ Ολοκλήρωση</button><button class="btn red" id="skipBtn">↪ Παράλειψη</button></div><div class="spacer"></div><div class="stats"><div class="stat"><b id="waiting">0</b>Αναμονή</div><div class="stat"><b id="served">0</b>Ολοκληρώθηκαν</div><div class="stat"><b id="expired">0</b>Έληξαν</div></div><h3>Λίστα αριθμών</h3><div id="queue"></div><div class="spacer"></div><div class="controls"><button class="btn alt" id="pauseBtn">Παύση νέων αριθμών</button><button class="btn red" id="resetBtn">Reset ημέρας</button><button class="btn alt" id="logout">Αποσύνδεση</button></div></div><p class="error" id="error"></p></section></main><script src="/app.js"></script></body></html>
