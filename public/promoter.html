<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promoter · Ξωτικουργείο</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><div class="brand">Περιστέρι Πολλών Αστέρων</div><h1 class="heading">Promoter</h1><div class="sub2">✍️ Χειρόγραφη έκδοση αριθμών</div><section class="panel"><div class="login" id="login"><h2>Σύνδεση Promoter</h2><input type="password" id="password" placeholder="Κωδικός promoter" autocomplete="current-password"><button class="btn full" id="loginBtn">Σύνδεση</button></div><div id="work" class="hidden"><h2>Για πόσα παιδάκια;</h2><div class="choices" id="choices"><button class="selected" data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button></div><button class="btn full" id="manual">✍️ Έκδοση για χειρόγραφο</button><div class="ticket hidden" id="ticket"><div class="label">Γράψε στο χαρτάκι:</div><div class="numbers" id="numbers"></div></div><div class="spacer"></div><div class="center">Επόμενος διαθέσιμος: <b id="next">—</b></div><div class="spacer"></div><button class="btn alt full" id="logout">Αποσύνδεση</button></div><p class="error" id="error"></p></section></main><script src="/app.js"></script></body></html>
