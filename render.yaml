services:
  - type: web
    name: xotikourgeio
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: echo "No build required"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://tukqupuonzhozrwyaxqc.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PROMOTER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
